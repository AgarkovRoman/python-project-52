{% extends 'task_manager/base.html' %}

{% block content %}
    <div class="mx-auto max-w-md rounded-lg bg-white p-8 text-center shadow-sm">
        <h1 class="mb-4 text-2xl font-bold text-slate-800">Удаление статуса</h1>
        <p class="mb-6 text-slate-600">Вы уверены, что хотите удалить {{ object.name }}?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="rounded-md bg-red-600 px-4 py-2 text-white hover:bg-red-700">
                Да, удалить
            </button>
        </form>
    </div>
{% endblock %}
