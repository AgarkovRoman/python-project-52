[project]
name = "hexlet-code"
version = "0.1.0"
description = "Task manager built with Django"
authors = [
    { name = "Roman Agarkov", email = "roman@reliant.ai" }
]
requires-python = ">=3.10"
dependencies = [
    "django>=5.0,<6.0",
    "python-dotenv>=1.0.1",
    "dj-database-url>=2.3.0",
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.9",
    "whitenoise>=6.7.0",
    "django-tailwind-cli>=4.7.0",
    "django-filter>=26.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "flake8>=7.3.0",
]
